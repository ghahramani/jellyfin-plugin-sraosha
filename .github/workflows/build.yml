name: Build & Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Jellyfin.Plugin.Sraosha/Jellyfin.Plugin.Sraosha.csproj

    - name: Build Plugin
      run: dotnet build Jellyfin.Plugin.Sraosha/Jellyfin.Plugin.Sraosha.csproj --configuration Release --no-restore
