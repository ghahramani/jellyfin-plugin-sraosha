name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need a token with write access to push manifest updates back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore Jellyfin.Plugin.Sraosha/Jellyfin.Plugin.Sraosha.csproj /p:NET10=true

      - name: Build plugin (Release)
        run: dotnet build Jellyfin.Plugin.Sraosha/Jellyfin.Plugin.Sraosha.csproj -c Release --no-restore /p:NET10=true

      - name: Publish plugin
        run: dotnet publish Jellyfin.Plugin.Sraosha/Jellyfin.Plugin.Sraosha.csproj -c Release -o ./publish --no-build /p:NET10=true

      - name: Extract version from tag or csproj
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' Jellyfin.Plugin.Sraosha/Jellyfin.Plugin.Sraosha.csproj || echo "1.0.0.0")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Package distribution ZIP
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          PKG_DIR=$(mktemp -d)
          cp ./publish/Jellyfin.Plugin.Sraosha.dll "$PKG_DIR/"
          cp Jellyfin.Plugin.Sraosha/meta.json "$PKG_DIR/"
          cp Jellyfin.Plugin.Sraosha/icon.png "$PKG_DIR/"

          ZIP_NAME="Jellyfin.Plugin.Sraosha_${VERSION}.zip"
          # Normalize timestamps and strip attributes for deterministic zip hash
          find "$PKG_DIR" -exec touch -t 202601010000.00 {} +
          (cd "$PKG_DIR" && zip -X -9 -r "$GITHUB_WORKSPACE/dist/$ZIP_NAME" ./*)
          rm -rf "$PKG_DIR"

          MD5_SUM=$(md5sum "dist/$ZIP_NAME" | awk '{print $1}')
          SHA256_SUM=$(sha256sum "dist/$ZIP_NAME" | awk '{print $1}')

          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "md5=$MD5_SUM" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256_SUM" >> $GITHUB_OUTPUT

          echo "::notice title=Artifact Packaged::Archive: $ZIP_NAME | MD5: $MD5_SUM | SHA256: $SHA256_SUM"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: dist/${{ steps.package.outputs.zip_name }}

      # -----------------------------------------------------------------------
      # On a tag push: update manifest.json with the REAL checksum from the
      # freshly-built zip, then commit it back so the manifest is always in sync.
      # -----------------------------------------------------------------------
      - name: Update manifest.json with correct checksum
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MD5="${{ steps.package.outputs.md5 }}"
          REPO="${{ github.repository }}"
          ZIP_NAME="${{ steps.package.outputs.zip_name }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SOURCE_URL="https://github.com/${REPO}/releases/download/v${VERSION}/${ZIP_NAME}"

          python3 - <<EOF
          import json, sys

          with open("manifest.json") as f:
              manifest = json.load(f)

          entry = manifest[0]
          new_versions = []

          # Build fresh version entries — one per supported ABI
          for abi in ["12.0.0.0", "10.10.0.0", "10.9.0.0"]:
              new_versions.append({
                  "version": "${VERSION}",
                  "changelog": entry["versions"][0]["changelog"] if entry.get("versions") else "Release ${VERSION}.",
                  "targetAbi": abi,
                  "sourceUrl": "${SOURCE_URL}",
                  "checksum": "${MD5}",
                  "timestamp": "${TIMESTAMP}"
              })

          entry["versions"] = new_versions
          manifest[0] = entry

          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")

          print(f"manifest.json updated: version=${VERSION}, md5=${MD5}")
          EOF

      - name: Commit updated manifest.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          # Only commit if the manifest actually changed
          git diff --cached --quiet || git commit -m "chore: update manifest.json checksum for v${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ steps.package.outputs.zip_name }}
            manifest.json
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🛡️ Sraosha — The Sleepless Sentinel for Jellyfin

            **Checksums:**
            - **MD5:** `${{ steps.package.outputs.md5 }}`
            - **SHA256:** `${{ steps.package.outputs.sha256 }}`

            #### Install via Jellyfin Plugin Catalog
            Go to **Dashboard → Plugins → Repositories → +** and add:
            ```
            https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json
            ```
            Then open the **Catalog** tab, find **Sraosha**, and click **Install**.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
